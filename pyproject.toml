[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-search"
version = "0.1.0"
description = "Anonymous same-day cross-camera person route reconstruction for forensic search (code-only prototype)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Shitanshu Sharma"}
]
dependencies = [
    "numpy==2.2.0",
    "opencv-python-headless==5.0.0.93",
    "Pillow==13.0.0",
    "imagehash==4.3.2",
    "PyWavelets==1.9.0",
    "scipy==1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
markers = [
    "ffmpeg_real: marks tests that test real FFmpeg behavior",
]
