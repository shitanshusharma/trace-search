name: Project Rules

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-action-shas:
    name: rules / validate-action-shas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Validate action pins are peeled commits on the named upstream tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/validate_action_shas.py

  check:
    name: rules / project-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Run project rules check
      run: python scripts/check_project_rules.py
    
    - name: Upload violations report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: project-rules-violations
        path: project-rules-violations.json
        retention-days: 90
