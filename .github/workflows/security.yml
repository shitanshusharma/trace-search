name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: security / bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Check out code
      uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install bandit
      run: pip install bandit[toml]==1.8.0
    
    - name: Run bandit
      run: |
        bandit -r src/ scripts/ \
          -f sarif \
          -o bandit-results.sarif \
          --severity-level medium \
          --exit-zero
    
    - name: Upload SARIF to code scanning
      uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
      with:
        sarif_file: bandit-results.sarif
        category: bandit
    
    - name: Check for high/critical issues
      run: |
        bandit -r src/ scripts/ \
          --severity-level high \
          -ll \
          -f txt

  semgrep:
    name: security / semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Check out code
      uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install semgrep
      run: pip install semgrep==1.99.0
    
    - name: Run semgrep
      run: |
        semgrep scan \
          --config=auto \
          --config=p/owasp-top-ten \
          --config=p/security-audit \
          --config=p/python \
          --sarif \
          --output=semgrep-results.sarif \
          --severity=WARNING \
          --error || true
    
    - name: Upload SARIF to code scanning
      uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
      with:
        sarif_file: semgrep-results.sarif
        category: semgrep
    
    - name: Check for high/critical issues
      run: |
        semgrep scan \
          --config=auto \
          --config=p/owasp-top-ten \
          --config=p/security-audit \
          --config=p/python \
          --severity=ERROR

  pip-audit:
    name: security / pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Check out code
      uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install pip-audit
      run: pip install pip-audit==2.7.3
    
    - name: Install project dependencies
      run: |
        pip install -e .
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r requirements-ci.txt
    
    - name: Run pip-audit
      run: |
        pip-audit \
          --desc \
          --format=json \
          --output=pip-audit-results.json \
          --vulnerability-service=osv
    
    - name: Check for high/critical vulnerabilities
      run: |
        pip-audit \
          --strict \
          --vulnerability-service=osv
    
    - name: Upload audit results
      if: always()
      uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
      with:
        name: pip-audit-results
        path: pip-audit-results.json
        retention-days: 90

  dependency-review:
    name: security / dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Check out code
      uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
    
    - name: Dependency Review
      uses: actions/dependency-review-action@a6993e2c61fd5dc440b409aa1d6904921c5e1894 # v4.5.0
      with:
        fail-on-severity: high
        deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  npm-audit:
    name: security / npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: hashFiles('ui/package-lock.json', 'web/package-lock.json') != ''
    
    steps:
    - name: Check out code
      uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
    
    - name: Detect UI directory
      id: detect
      run: |
        if [ -f "ui/package-lock.json" ]; then
          echo "dir=ui" >> $GITHUB_OUTPUT
        elif [ -f "web/package-lock.json" ]; then
          echo "dir=web" >> $GITHUB_OUTPUT
        fi
    
    - name: Set up Node.js
      uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
      with:
        node-version: '20'
    
    - name: Run npm audit
      working-directory: ${{ steps.detect.outputs.dir }}
      run: |
        npm audit --audit-level=high --production
