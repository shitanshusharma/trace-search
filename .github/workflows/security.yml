name: Security Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: security / bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install bandit
      run: pip install --require-hashes --no-deps -r requirements-ci.lock
    
    - name: Run bandit
      run: |
        bandit -r src/ scripts/ \
          -c .bandit.toml \
          -f sarif \
          -o bandit-results.sarif \
          --severity-level medium \
          --exit-zero
    
    - name: Upload SARIF to code scanning
      if: always()
      uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
      with:
        sarif_file: bandit-results.sarif
        category: bandit
    
    - name: Check for high/critical issues
      run: |
        bandit -r src/ scripts/ \
          -c .bandit.toml \
          --severity-level high \
          -f txt

  semgrep:
    name: security / semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
    
    - name: Install semgrep
      run: pip install --require-hashes --no-deps -r requirements-ci.lock
    
    - name: Run semgrep
      run: |
        semgrep scan \
          --error \
          --metrics=off \
          --config=.semgrep.yml \
          --config=p/owasp-top-ten \
          --config=p/security-audit \
          --config=p/python \
          --exclude tests/semgrep \
          --sarif \
          --output=semgrep-results.sarif \
          --severity=WARNING
    
    - name: Show semgrep findings
      if: always()
      run: |
        semgrep scan \
          --metrics=off \
          --config=.semgrep.yml \
          --config=p/owasp-top-ten \
          --config=p/security-audit \
          --config=p/python \
          --exclude tests/semgrep \
          --severity=WARNING || true
    
    - name: Upload SARIF to code scanning
      if: always()
      uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
      with:
        sarif_file: semgrep-results.sarif
        category: semgrep
    
    - name: Check for high/critical issues
      run: |
        semgrep scan \
          --error \
          --metrics=off \
          --config=.semgrep.yml \
          --config=p/owasp-top-ten \
          --config=p/security-audit \
          --config=p/python \
          --exclude tests/semgrep \
          --severity=ERROR

    - name: Test custom semgrep rules
      run: semgrep --test --metrics=off --config .semgrep.yml tests/semgrep/rules.py

  pip-audit:
    name: security / pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install CI tools
      run: pip install --require-hashes --no-deps -r requirements-ci.lock

    - name: Run pip-audit and name any vulnerable packages
      run: |
        # The CI-tools env is what this job installed. -r cannot resolve the
        # hand-pinned mcp override, so audit that environment directly.
        pip-audit \
          --desc \
          --format=columns \
          --vulnerability-service=osv \
          --strict
        pip-audit \
          -r requirements-dev.lock \
          --desc \
          --format=columns \
          --vulnerability-service=osv \
          --strict
        pip-audit \
          --format=json \
          --output=pip-audit-results.json \
          --vulnerability-service=osv \
          --strict
    
    - name: Upload audit results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pip-audit-results
        path: pip-audit-results.json
        retention-days: 90

  dependency-review:
    name: security / dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Dependency Review
      uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
      with:
        fail-on-severity: high
        deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  npm-audit:
    name: security / npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Check for UI package
      id: check-ui
      run: |
        if [ -f "ui/package-lock.json" ] || [ -f "web/package-lock.json" ]; then
          echo "has_ui=true" >> $GITHUB_OUTPUT
          if [ -f "ui/package-lock.json" ]; then
            echo "dir=ui" >> $GITHUB_OUTPUT
          else
            echo "dir=web" >> $GITHUB_OUTPUT
          fi
        else
          echo "has_ui=false" >> $GITHUB_OUTPUT
          echo "No UI package-lock.json found - skipping npm audit"
        fi
    
    - name: Set up Node.js
      if: steps.check-ui.outputs.has_ui == 'true'
      uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
      with:
        node-version: '20'
    
    - name: Run npm audit
      if: steps.check-ui.outputs.has_ui == 'true'
      working-directory: ${{ steps.check-ui.outputs.dir }}
      run: |
        npm audit --audit-level=high --production
