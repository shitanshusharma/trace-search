name: CI

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test, and License Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    
    - name: Set up Python 3.11
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-dev.lock
        if [ -f requirements.txt ]; then pip install --require-hashes -r requirements.txt; fi
        pip install -e .
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/ scripts/

    - name: Check FFmpeg LGPL compliance
      run: |
        python3 -c "
        from trace_search.ingest.ffmpeg_check import check_ffmpeg_lgpl_compliance
        passed, message = check_ffmpeg_lgpl_compliance()
        if not passed:
            raise AssertionError(f'FFmpeg LGPL compliance check failed: {message}')
        print(f'✓ {message}')
        "

    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short

    - name: Worktree clean after pytest
      run: |
        dirty="$(git status --porcelain)"
        if [ -n "$dirty" ]; then
          echo "git status --porcelain was not clean after pytest:"
          printf '%s\n' "$dirty"
          exit 1
        fi
        if [ -d audit_logs ]; then
          echo "pytest created audit_logs/ in the repo checkout"
          exit 1
        fi

    - name: License fence check
      run: |
        python scripts/check_licenses.py --requirements=requirements.txt --requirements=requirements-dev.txt --report=license-report.json

    - name: CI tools banned-licence check
      run: |
        # Own venv. Do not install this lock into the app environment,
        # and do not uninstall packages from either environment.
        python -m venv .venv-ci-fence
        .venv-ci-fence/bin/python -m pip install --require-hashes --no-deps -r requirements-ci.lock
        site="$(.venv-ci-fence/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
        PYTHONPATH=src .venv-ci-fence/bin/python -m scripts.check_ci_licenses --path "$site" --report ci-tools-licence-report.json

    - name: AC-13 audit log demo
      run: |
        python scripts/demo_audit_log.py --json

    - name: Upload license report
      if: always()
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874  # v4.4.0
      with:
        name: license-report
        path: |
          license-report.json
          ci-tools-licence-report.json
        retention-days: 90

  fixture-separation:
    name: Fixture separation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    
    - name: Set up Python 3.11
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install -e .
    
    - name: Run fixture separation check
      run: |
        python scripts/check_separation.py --json
      env:
        PYTHONPATH: src
