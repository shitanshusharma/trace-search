name: CI

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Test, and License Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/ scripts/
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: License fence check
      run: |
        python3 scripts/check_licenses.py
    
    - name: Verify license manifest exists
      run: |
        test -f licenses/manifest.json || (echo "ERROR: licenses/manifest.json not found" && exit 1)
        test -f licenses/manifest_schema.json || (echo "ERROR: licenses/manifest_schema.json not found" && exit 1)
