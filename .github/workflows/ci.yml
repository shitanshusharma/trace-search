name: CI

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test, and License Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    
    - name: Set up Python 3.11
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-dev.lock
        if [ -f requirements.txt ]; then pip install --require-hashes -r requirements.txt; fi
        pip install -e .
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/ scripts/
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: License fence check
      run: |
        python scripts/check_licenses.py --requirements=requirements.txt --requirements=requirements-dev.txt --report=license-report.json
    
    - name: Upload license report
      if: always()
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874  # v4.4.0
      with:
        name: license-report
        path: license-report.json
        retention-days: 90

  fixture-separation:
    name: Fixture separation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    
    - name: Set up Python 3.11
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install -e .
    
    - name: Run fixture separation check
      run: |
        python scripts/check_separation.py --json
      env:
        PYTHONPATH: src
