name: CI

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test, and License Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    
    - name: Set up Python 3.11
      uses: actions/setup-python@a0f65ab4d4d5f03084c96de66f28ea6ec8a5b652  # v5.4.1
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/ scripts/
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: License fence check
      run: |
        python scripts/check_licenses.py --report=license-report.json
    
    - name: Upload license report
      if: always()
      uses: actions/upload-artifact@1a4cd7c89afa8f33ab994e05b68ed1d3f68e5487  # v4.6.0
      with:
        name: license-report
        path: license-report.json
        retention-days: 90
