name: CI

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test, and License Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/ scripts/
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short
      env:
        NO_FFMPEG_CHECK: '1'
    
    - name: License fence check
      run: |
        python scripts/check_licenses.py --report=license-report.json
      env:
        NO_FFMPEG_CHECK: '1'
    
    - name: Upload license report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: license-report.json
        retention-days: 90
